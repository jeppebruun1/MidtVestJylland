<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midt-Vest Jylland · Virksomhedskort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
:root {
  --ink: #0a0e1a;
  --ink-2: #11172a;
  --ink-3: #1a2238;
  --paper: #f4ede0;
  --rule: #2a3552;
  --accent: #d4a849;
  --accent-2: #b8893a;
  --orange: #ff8c42;
  --green: #5fa074;
  --red: #c0594f;
  --text: #e8dfc9;
  --text-dim: #8d97b3;
  --text-dimmer: #5d6789;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--ink);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
}

/* --- LAYOUT --- */
.app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
}

header {
  background: var(--ink-2);
  border-bottom: 1px solid var(--rule);
  padding: 18px 28px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 32px;
  z-index: 1000;
  position: relative;
}

.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.brand-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
}
.brand-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--paper);
  font-variation-settings: 'opsz' 36;
  letter-spacing: -0.01em;
}
.brand-title em { font-style: italic; color: var(--accent); font-weight: 400; }

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: center;
}
.search-wrap {
  position: relative;
  width: 300px;
}
.search-input {
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--rule);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 10px 14px 10px 36px;
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text-dimmer); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dimmer);
  pointer-events: none;
  font-size: 13px;
}
.search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  max-height: 360px;
  overflow-y: auto;
  z-index: 2000;
  display: none;
}
.search-results.active { display: block; }
.search-result-item {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background 0.15s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--ink-3); }
.search-result-name {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  color: var(--paper);
  font-size: 13px;
}
.search-result-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

.kommune-select {
  background: var(--ink);
  border: 1px solid var(--rule);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  padding: 10px 14px;
  outline: none;
  cursor: pointer;
  min-width: 200px;
}
.kommune-select:focus { border-color: var(--accent); }

.stats {
  display: flex;
  gap: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.stat strong {
  color: var(--paper);
  font-weight: 500;
  display: block;
  font-size: 18px;
  letter-spacing: 0;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}

/* --- MAP --- */
.map-container {
  position: relative;
}
#map {
  width: 100%;
  height: 100%;
  background: #1a2238;
}

/* Override Leaflet attribution and zoom to fit dark theme */
.leaflet-control-attribution {
  background: rgba(10, 14, 26, 0.85) !important;
  color: var(--text-dim) !important;
  border: 1px solid var(--rule) !important;
  font-family: 'JetBrains Mono', monospace !important;
  font-size: 9px !important;
  padding: 3px 8px !important;
}
.leaflet-control-attribution a { color: var(--accent) !important; }
.leaflet-control-zoom { border: none !important; }
.leaflet-control-zoom a {
  background: var(--ink-2) !important;
  color: var(--paper) !important;
  border: 1px solid var(--rule) !important;
  font-family: 'Fraunces', serif !important;
  font-size: 18px !important;
  font-weight: 400 !important;
}
.leaflet-control-zoom a:hover { background: var(--ink-3) !important; color: var(--accent) !important; }

/* Tile filtering to darken the basemap */
.leaflet-tile-pane {
  filter: invert(0.93) hue-rotate(180deg) brightness(0.95) contrast(0.85) saturate(0.6);
}

/* Custom cluster icon */
.custom-cluster {
  background: rgba(212, 168, 73, 0.85);
  border: 2px solid var(--accent);
  color: var(--ink);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(212, 168, 73, 0.4);
  transition: transform 0.2s;
}
.custom-cluster:hover { transform: scale(1.1); }
.custom-cluster.small { width: 32px; height: 32px; font-size: 11px; }
.custom-cluster.medium { width: 42px; height: 42px; font-size: 13px; }
.custom-cluster.large { width: 54px; height: 54px; font-size: 15px; }
.custom-cluster.xlarge { width: 68px; height: 68px; font-size: 17px; }
.custom-cluster.protected {
  background: rgba(141, 151, 179, 0.7);
  border-color: var(--text-dim);
  box-shadow: 0 4px 16px rgba(141, 151, 179, 0.3);
}

/* Custom marker for individual companies */
.custom-pin {
  background: var(--accent);
  border: 2px solid var(--ink);
  border-radius: 50%;
  width: 14px !important;
  height: 14px !important;
  box-shadow: 0 2px 8px rgba(212, 168, 73, 0.5);
}
.custom-pin.protected {
  background: var(--text-dim);
}

/* --- SIDE PANEL --- */
.panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 480px;
  background: var(--ink-2);
  border-left: 1px solid var(--rule);
  box-shadow: -20px 0 40px rgba(0,0,0,0.4);
  z-index: 1500;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
  overflow: hidden;
}
.panel.active { transform: translateX(0); }
.panel-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-shrink: 0;
}
.panel-title-wrap { flex: 1; min-width: 0; }
.panel-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.panel-title {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--paper);
  font-variation-settings: 'opsz' 36;
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.panel-title em { font-style: italic; color: var(--accent); }
.panel-sub {
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}
.panel-close {
  background: none;
  border: 1px solid var(--rule);
  color: var(--text-dim);
  width: 32px;
  height: 32px;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.panel-close:hover { color: var(--accent); border-color: var(--accent); }

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-track { background: var(--ink-3); }
.panel-body::-webkit-scrollbar-thumb { background: var(--rule); }

/* Table view (when bubble is clicked) */
.companies-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.companies-table th {
  background: var(--ink-3);
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
  text-align: left;
  padding: 10px 14px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-bottom: 1px solid var(--rule);
}
.companies-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--rule);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
}
.companies-table td.navn {
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  color: var(--paper);
  cursor: pointer;
  transition: color 0.15s;
}
.companies-table td.navn:hover { color: var(--accent); }
.companies-table tr:hover td { background: var(--ink-3); }
.companies-table tr.protected td { color: var(--text-dimmer); }

/* Detailed company view */
.company-detail { padding: 24px; }
.detail-block {
  margin-bottom: 28px;
}
.detail-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-dimmer);
  margin-bottom: 6px;
}
.detail-value {
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--paper);
  font-weight: 500;
  line-height: 1.4;
}
.detail-value.mono { font-family: 'JetBrains Mono', monospace; font-weight: 400; }
.detail-value a { color: var(--accent); text-decoration: none; }
.detail-value a:hover { text-decoration: underline; }
.detail-value.dim { color: var(--text-dim); font-style: italic; font-weight: 400; }

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  background: var(--rule);
  border: 1px solid var(--rule);
  margin-bottom: 24px;
}
.detail-grid > div {
  background: var(--ink-2);
  padding: 14px 18px;
}
.detail-grid > div .detail-label { margin-bottom: 4px; }
.detail-grid > div .detail-value { font-size: 14px; }

.ebt-chart {
  margin-top: 8px;
  margin-bottom: 8px;
}
.ebt-bar {
  display: grid;
  grid-template-columns: 50px 1fr 90px;
  gap: 12px;
  align-items: center;
  padding: 7px 0;
}
.ebt-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.ebt-bar-track {
  height: 10px;
  background: var(--ink-3);
  position: relative;
  overflow: hidden;
}
.ebt-bar-fill {
  position: absolute;
  inset: 0 auto 0 50%;
  height: 100%;
  transition: width 0.4s;
}
.ebt-bar-fill.pos { background: var(--green); }
.ebt-bar-fill.neg { background: var(--red); transform-origin: right; }
.ebt-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  text-align: right;
  font-weight: 500;
}
.ebt-value.pos { color: var(--green); }
.ebt-value.neg { color: var(--red); }
.ebt-value.miss { color: var(--text-dimmer); font-style: italic; }

.section-h {
  font-family: 'Fraunces', serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--paper);
  margin-bottom: 12px;
  font-variation-settings: 'opsz' 14;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 8px;
}

/* Legend */
.legend {
  position: absolute;
  bottom: 24px;
  left: 24px;
  background: var(--ink-2);
  border: 1px solid var(--rule);
  padding: 14px 18px;
  font-size: 11px;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  z-index: 800;
  max-width: 280px;
}
.legend-title {
  font-family: 'Fraunces', serif;
  color: var(--paper);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  font-size: 11px;
}
.legend-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
}
.legend-dot.cluster {
  background: rgba(212, 168, 73, 0.85);
  border: 2px solid var(--accent);
  color: var(--ink);
  font-weight: 600;
}
.legend-dot.cluster-protected {
  background: rgba(141, 151, 179, 0.7);
  border: 2px solid var(--text-dim);
  color: var(--ink);
  font-weight: 600;
}
.legend-dot.pin {
  width: 10px;
  height: 10px;
  background: var(--accent);
  border: 2px solid var(--ink);
}

/* Loading */
.loading {
  position: fixed;
  inset: 0;
  background: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  z-index: 9999;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  font-size: 11px;
  letter-spacing: 0.2em;
}
.loading-bar {
  width: 200px;
  height: 2px;
  background: var(--ink-3);
  overflow: hidden;
}
.loading-bar::after {
  content: '';
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: loading-slide 1.2s infinite linear;
}
@keyframes loading-slide {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* Responsive */
@media (max-width: 900px) {
  header {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 14px 16px;
  }
  .controls { flex-direction: column; align-items: stretch; }
  .search-wrap { width: 100%; }
  .stats { justify-content: space-between; }
  .panel { width: 100%; }
  .legend { max-width: 220px; bottom: 12px; left: 12px; padding: 10px 12px; }
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div>INDLÆSER VIRKSOMHEDSKORT</div>
  <div class="loading-bar"></div>
</div>

<div class="app" id="app" style="visibility:hidden;">
  <header>
    <div class="brand">
      <div class="brand-eyebrow">Midt-Vest Jylland · 599 selskaber</div>
      <div class="brand-title">Virksomheds<em>kort</em></div>
    </div>
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="search-input" placeholder="Søg på selskabsnavn eller CVR..." autocomplete="off">
        <div class="search-results" id="search-results"></div>
      </div>
      <select class="kommune-select" id="kommune-select">
        <option value="">Alle kommuner</option>
      </select>
    </div>
    <div class="stats">
      <div class="stat">Selskaber<strong id="stat-total">0</strong></div>
      <div class="stat">På kort<strong id="stat-precise">0</strong></div>
      <div class="stat">Adressebeskyttede<strong id="stat-protected">0</strong></div>
    </div>
  </header>
  
  <div class="map-container">
    <div id="map"></div>
    
    <div class="legend">
      <div class="legend-title">Forklaring</div>
      <div class="legend-item">
        <span class="legend-dot cluster">N</span>
        <span>Klynge — antal selskaber i området</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot pin"></span>
        <span>Enkelt selskab (zoom ind for at se)</span>
      </div>
      <div class="legend-item">
        <span class="legend-dot cluster-protected">N</span>
        <span>Adressebeskyttede (vist samlet)</span>
      </div>
    </div>
    
    <div class="panel" id="panel">
      <div class="panel-header" id="panel-header"></div>
      <div class="panel-body" id="panel-body"></div>
    </div>

<script>
// ========== Load data ==========
function loadData() {
  const b64str = document.getElementById('data-b64').textContent.trim();
  const binStr = atob(b64str);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return JSON.parse(pako.ungzip(bytes, { to: 'string' }));
}

const DATA = loadData();
const CVR_INDEX = {};
DATA.companies.forEach(c => { CVR_INDEX[c.cvr] = c; });

// ========== Format helpers ==========
function fmtDKK(v) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  const abs = Math.abs(v);
  let s;
  if (abs >= 1e9) s = (v/1e9).toFixed(2) + ' mia';
  else if (abs >= 1e6) s = (v/1e6).toFixed(1) + 'M';
  else if (abs >= 1e3) s = (v/1e3).toFixed(0) + 'k';
  else s = v.toFixed(0);
  return s;
}
function fmtPhone(p) {
  if (!p) return '—';
  return p.replace(/(\d{2})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4');
}

// ========== Map setup ==========
const map = L.map('map', {
  center: [56.1, 8.8],
  zoom: 8,
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19,
}).addTo(map);

// ========== Stats ==========
document.getElementById('stat-total').textContent = DATA.meta.total;
document.getElementById('stat-precise').textContent = DATA.meta.precise;
document.getElementById('stat-protected').textContent = DATA.meta.protected;

// ========== Kommune select ==========
const kommuneSelect = document.getElementById('kommune-select');
DATA.meta.kommuner.forEach(k => {
  const opt = document.createElement('option');
  opt.value = k;
  opt.textContent = k + ' (' + (DATA.kommune_stats[k] || 0) + ')';
  kommuneSelect.appendChild(opt);
});

// ========== Markers ==========
// Cluster groups
const preciseCluster = L.markerClusterGroup({
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let size = 'small';
    if (count >= 50) size = 'xlarge';
    else if (count >= 20) size = 'large';
    else if (count >= 8) size = 'medium';
    return L.divIcon({
      html: '<div class="custom-cluster ' + size + '">' + count + '</div>',
      className: '',
      iconSize: null,
    });
  },
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 13,
});

const protectedCluster = L.markerClusterGroup({
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    let size = 'small';
    if (count >= 100) size = 'xlarge';
    else if (count >= 50) size = 'large';
    else if (count >= 20) size = 'medium';
    return L.divIcon({
      html: '<div class="custom-cluster protected ' + size + '">' + count + '</div>',
      className: '',
      iconSize: null,
    });
  },
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: false,
  showCoverageOnHover: false,
  disableClusteringAtZoom: 20,  // never split them
});

// Individual markers
const allMarkers = {};  // cvr -> marker

DATA.companies.forEach(c => {
  if (c.lat !== null && c.lng !== null) {
    const icon = L.divIcon({
      className: 'custom-pin' + (c.protected ? ' protected' : ''),
      iconSize: [14, 14],
    });
    // Jitter same-postnummer pins slightly so they don't sit on top
    const jitter = 0.003;
    const lat = c.lat + (Math.random() - 0.5) * jitter;
    const lng = c.lng + (Math.random() - 0.5) * jitter;
    const marker = L.marker([lat, lng], { icon: icon });
    marker.cvr = c.cvr;
    marker.on('click', function(e) {
      L.DomEvent.stopPropagation(e);
      showCompanyDetail(c.cvr);
    });
    
    if (c.protected) {
      protectedCluster.addLayer(marker);
    } else {
      preciseCluster.addLayer(marker);
    }
    allMarkers[c.cvr] = marker;
  }
});

map.addLayer(preciseCluster);
map.addLayer(protectedCluster);

// Click on cluster - show table for that cluster
preciseCluster.on('clusterclick', function(e) {
  const markers = e.layer.getAllChildMarkers();
  const cvrs = markers.map(m => m.cvr);
  showBubbleTable(cvrs, e.layer.getChildCount());
  // Still zoom to bounds for natural feel
  setTimeout(() => e.layer.zoomToBounds(), 50);
});

protectedCluster.on('clusterclick', function(e) {
  const markers = e.layer.getAllChildMarkers();
  const cvrs = markers.map(m => m.cvr);
  showBubbleTable(cvrs, e.layer.getChildCount(), true);
});

// ========== Panel ==========
const panel = document.getElementById('panel');
const panelHeader = document.getElementById('panel-header');
const panelBody = document.getElementById('panel-body');

function closePanel() {
  panel.classList.remove('active');
}

function showBubbleTable(cvrs, count, isProtected) {
  const companies = cvrs.map(c => CVR_INDEX[c]).filter(Boolean);
  // Sort by name
  companies.sort((a, b) => a.navn.localeCompare(b.navn, 'da'));
  
  // Try to find common location info from first company
  const first = companies[0];
  const locationName = isProtected ? 'Adressebeskyttede selskaber' :
    (first.by ? (first.by + (first.postnr ? ' · ' + first.postnr : '')) : 'Klynge');
  const kommune = isProtected ? '—' : (first.kommune || '—');
  
  panelHeader.innerHTML = `
    <div class="panel-title-wrap">
      <div class="panel-eyebrow">KLYNGE · ${count} SELSKABER</div>
      <div class="panel-title">${locationName.replace(/·/g, '<em>·</em>')}</div>
      <div class="panel-sub">${kommune}${isProtected ? ' · placeret samlet på regionscentrum' : ' Kommune'}</div>
    </div>
    <button class="panel-close" onclick="closePanel()">×</button>
  `;
  
  let html = '<table class="companies-table">';
  html += '<thead><tr><th>Navn</th><th>Direktør</th><th>EBT 2024</th><th>By</th></tr></thead><tbody>';
  companies.forEach(c => {
    const ebt = c.ebt['2024'];
    html += `<tr class="${c.protected ? 'protected' : ''}">`;
    html += `<td class="navn" onclick="showCompanyDetail('${c.cvr}')">${c.navn}</td>`;
    html += `<td>${c.direktor || '—'}</td>`;
    html += `<td>${ebt !== null ? fmtDKK(ebt) : '—'}</td>`;
    html += `<td>${c.protected ? '<em>Beskyttet</em>' : (c.by || '—')}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  panelBody.innerHTML = html;
  panel.classList.add('active');
}

function showCompanyDetail(cvr) {
  const c = CVR_INDEX[cvr];
  if (!c) return;
  
  panelHeader.innerHTML = `
    <div class="panel-title-wrap">
      <div class="panel-eyebrow">SELSKAB · CVR ${c.cvr}</div>
      <div class="panel-title">${c.navn}</div>
      <div class="panel-sub">${c.kommune ? c.kommune + ' Kommune' : (c.protected ? 'Adressebeskyttet' : '—')} · ${c.selskabsform || ''}</div>
    </div>
    <button class="panel-close" onclick="closePanel()">×</button>
  `;
  
  // Compute EBT chart bounds
  const ebtVals = Object.values(c.ebt).filter(v => v !== null);
  const maxAbs = ebtVals.length ? Math.max(...ebtVals.map(Math.abs)) : 1;
  
  let html = '<div class="company-detail">';
  
  // Contact block
  html += '<div class="detail-grid">';
  html += `<div><div class="detail-label">Direktør</div><div class="detail-value">${c.direktor || '<span class="dim">Ikke oplyst</span>'}</div></div>`;
  html += `<div><div class="detail-label">Selskabsform</div><div class="detail-value">${c.selskabsform || '<span class="dim">—</span>'}</div></div>`;
  html += `<div><div class="detail-label">Email</div><div class="detail-value mono">${c.email ? '<a href="mailto:' + c.email + '">' + c.email + '</a>' : '<span class="dim">Ikke oplyst</span>'}</div></div>`;
  html += `<div><div class="detail-label">Telefon</div><div class="detail-value mono">${c.tlf ? '<a href="tel:' + c.tlf + '">' + fmtPhone(c.tlf) + '</a>' : '<span class="dim">—</span>'}</div></div>`;
  html += '</div>';
  
  // Address block
  html += '<div class="detail-block">';
  html += '<div class="section-h">Adresse</div>';
  if (c.protected) {
    html += '<div class="detail-value dim">Selskabet har valgt adressebeskyttelse — adresse, postnummer og by er ikke offentligt tilgængelige.</div>';
  } else {
    let addrLine = c.adresse || '';
    if (c.postnr || c.by) addrLine += '<br>' + (c.postnr || '') + ' ' + (c.by || '');
    if (c.kommune) addrLine += '<br><span style="color: var(--text-dim); font-size: 13px;">' + c.kommune + ' Kommune</span>';
    html += `<div class="detail-value">${addrLine || '<span class="dim">—</span>'}</div>`;
  }
  html += '</div>';
  
  // Branche
  if (c.branche) {
    html += '<div class="detail-block">';
    html += '<div class="section-h">Branche</div>';
    html += `<div class="detail-value" style="font-size: 13px;">${c.branche}</div>`;
    html += '</div>';
  }
  
  // EBT chart
  html += '<div class="detail-block">';
  html += '<div class="section-h">Resultat før skat · 2020–2024</div>';
  html += '<div class="ebt-chart">';
  ['2020', '2021', '2022', '2023', '2024'].forEach(y => {
    const v = c.ebt[y];
    if (v === null) {
      html += `<div class="ebt-bar"><span class="ebt-year">${y}</span><div class="ebt-bar-track"></div><span class="ebt-value miss">—</span></div>`;
    } else {
      const pct = (Math.abs(v) / maxAbs) * 50;
      const cls = v >= 0 ? 'pos' : 'neg';
      const fillStyle = v >= 0 
        ? `left: 50%; right: ${50 - pct}%;` 
        : `right: 50%; left: ${50 - pct}%;`;
      html += `<div class="ebt-bar"><span class="ebt-year">${y}</span><div class="ebt-bar-track"><div class="ebt-bar-fill ${cls}" style="${fillStyle}"></div></div><span class="ebt-value ${cls}">${fmtDKK(v)}</span></div>`;
    }
  });
  html += '</div>';
  html += '</div>';
  
  // Other 2024 financials
  if (c.omsaetning !== undefined && c.omsaetning !== null || c.bruttof || c.egenkapital || c.ansatte) {
    html += '<div class="detail-block">';
    html += '<div class="section-h">Nøgletal 2024</div>';
    html += '<div class="detail-grid">';
    if (c.omsaetning) html += `<div><div class="detail-label">Omsætning</div><div class="detail-value mono">${fmtDKK(c.omsaetning)}</div></div>`;
    if (c.bruttof) html += `<div><div class="detail-label">Bruttofortjeneste</div><div class="detail-value mono">${fmtDKK(c.bruttof)}</div></div>`;
    if (c.egenkapital !== null && c.egenkapital !== undefined) html += `<div><div class="detail-label">Egenkapital</div><div class="detail-value mono">${fmtDKK(c.egenkapital)}</div></div>`;
    if (c.balancesum) html += `<div><div class="detail-label">Balancesum</div><div class="detail-value mono">${fmtDKK(c.balancesum)}</div></div>`;
    if (c.ansatte) html += `<div><div class="detail-label">Antal ansatte</div><div class="detail-value mono">${c.ansatte}</div></div>`;
    html += '</div>';
    html += '</div>';
  }
  
  // Open in CVR.dk link
  html += '<div class="detail-block" style="margin-top: 32px; text-align: center;">';
  html += `<a href="https://datacvr.virk.dk/enhed/virksomhed/${c.cvr}" target="_blank" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); text-decoration: none; border: 1px solid var(--rule); padding: 10px 18px; display: inline-block;">Se på CVR.dk →</a>`;
  html += '</div>';
  
  html += '</div>';
  panelBody.innerHTML = html;
  panel.classList.add('active');
  
  // Pan map to company if possible
  if (c.lat !== null && c.lng !== null && allMarkers[c.cvr]) {
    map.setView([c.lat, c.lng], Math.max(map.getZoom(), 12), { animate: true });
  }
}

// Make functions globally accessible
window.closePanel = closePanel;
window.showCompanyDetail = showCompanyDetail;

// ========== Search ==========
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (q.length < 2) {
    searchResults.classList.remove('active');
    return;
  }
  const matches = DATA.companies.filter(c => 
    c.navn.toLowerCase().includes(q) || c.cvr.includes(q)
  ).slice(0, 12);
  
  if (matches.length === 0) {
    searchResults.innerHTML = '<div class="search-result-item"><div class="search-result-name" style="color: var(--text-dim); font-style: italic;">Ingen resultater</div></div>';
  } else {
    searchResults.innerHTML = matches.map(c => `
      <div class="search-result-item" onclick="searchSelect('${c.cvr}')">
        <div class="search-result-name">${c.navn}</div>
        <div class="search-result-meta">CVR ${c.cvr} · ${c.kommune || (c.protected ? 'Adressebeskyttet' : c.by || '—')}</div>
      </div>
    `).join('');
  }
  searchResults.classList.add('active');
});

window.searchSelect = function(cvr) {
  searchResults.classList.remove('active');
  searchInput.value = '';
  showCompanyDetail(cvr);
};

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) {
    searchResults.classList.remove('active');
  }
});

// ========== Kommune filter ==========
kommuneSelect.addEventListener('change', function() {
  const selected = this.value;
  
  // Clear and rebuild clusters with filter
  preciseCluster.clearLayers();
  protectedCluster.clearLayers();
  
  let count = 0, hadBounds = null;
  DATA.companies.forEach(c => {
    if (c.lat === null) return;
    if (selected && c.kommune !== selected) return;
    
    const m = allMarkers[c.cvr];
    if (!m) return;
    
    if (c.protected) {
      protectedCluster.addLayer(m);
    } else {
      preciseCluster.addLayer(m);
    }
    count++;
    if (!c.protected) {
      if (!hadBounds) hadBounds = L.latLngBounds([c.lat, c.lng], [c.lat, c.lng]);
      else hadBounds.extend([c.lat, c.lng]);
    }
  });
  
  if (selected && hadBounds) {
    map.fitBounds(hadBounds, { padding: [60, 60], maxZoom: 11 });
  } else if (!selected) {
    map.setView([56.1, 8.8], 8);
  }
});

// Close panel on map click
map.on('click', closePanel);

// ========== Final setup ==========
document.getElementById('loading').style.display = 'none';
document.getElementById('app').style.visibility = 'visible';
// Trigger resize so leaflet recalculates
setTimeout(() => map.invalidateSize(), 100);
</script>

</body>
</html>
